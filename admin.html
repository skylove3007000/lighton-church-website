<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>라이트온 교회 관리자</title><link rel="stylesheet" href="assets/css/styles.css"><style>
body{background:#f4f7fa}.admin{max-width:900px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #dbe6ee;border-radius:14px;padding:26px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:13px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid #cfdce5;border-radius:8px;padding:10px 12px}.field textarea{min-height:90px}.actions{display:flex;gap:10px;flex-wrap:wrap}.note{font-size:13px;color:#6f8294}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:0;font-size:28px}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="admin"><div class="card top"><div><div class="eyebrow">LIGHTON CHURCH</div><h1>홈페이지 관리자</h1></div><a class="btn secondary" href="index.html">홈페이지 보기 ↗</a></div>
<div class="card"><h2>기본 정보</h2><div class="grid"><div class="field"><label>교회명</label><input id="nameKo"></div><div class="field"><label>영문명</label><input id="nameEn"></div></div><div class="field"><label>한 줄 소개</label><input id="tagline"></div><div class="field"><label>메인 소개 문구</label><textarea id="subtitle"></textarea></div><div class="grid"><div class="field"><label>담임목사</label><input id="pastor"></div><div class="field"><label>이메일</label><input id="email"></div></div></div>
<div class="card"><h2>이번 주 설교</h2><div class="field"><label>설교 제목</label><input id="sermonTitle"></div><div class="field"><label>본문</label><input id="scripture"></div><div class="field"><label>YouTube URL</label><input id="youtube"></div><div class="field"><label>설교 소개</label><textarea id="summary"></textarea></div></div>
<div class="card"><h2>교육부</h2><div class="field"><label>메인 문구</label><textarea id="eduTitle"></textarea></div><div class="field"><label>교육부 소개</label><textarea id="eduDesc"></textarea></div><div class="grid"><div class="field"><label>예배 시간</label><input id="eduTime"></div><div class="field"><label>인도자</label><input id="eduLeader"></div></div></div>
<div class="card"><div class="actions"><button class="btn" id="save">이 브라우저에 미리보기 저장</button><button class="btn secondary" id="export">site-content.js 내보내기</button><button class="btn secondary" id="reset">초기화</button></div><p class="note">현재 관리자 수정은 이 브라우저의 미리보기용입니다. 도메인 연결과 함께 온라인 저장 방식은 다음 단계에서 추가할 수 있습니다.</p></div></main>
<script src="assets/data/site-content.js"></script><script>
let d;try{d=JSON.parse(localStorage.getItem('lightonSiteContent'))||structuredClone(window.SITE_CONTENT)}catch(e){d=structuredClone(window.SITE_CONTENT)}
const ids=['nameKo','nameEn','tagline','subtitle','pastor','email','sermonTitle','scripture','youtube','summary','eduTitle','eduDesc','eduTime','eduLeader'];
const paths={nameKo:['church','nameKo'],nameEn:['church','nameEn'],tagline:['church','tagline'],subtitle:['home','subtitle'],pastor:['pastor','name'],email:['church','email'],sermonTitle:['weeklySermon','title'],scripture:['weeklySermon','scripture'],youtube:['weeklySermon','youtubeUrl'],summary:['weeklySermon','summary'],eduTitle:['education','title'],eduDesc:['education','description'],eduTime:['education','time'],eduLeader:['education','leader']};
function get(p){return p.reduce((o,k)=>o?.[k],d)||''} function set(p,v){let o=d;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p.at(-1)]=v}
ids.forEach(id=>document.getElementById(id).value=get(paths[id]));document.getElementById('save').onclick=()=>{ids.forEach(id=>set(paths[id],document.getElementById(id).value));localStorage.setItem('lightonSiteContent',JSON.stringify(d));alert('저장했습니다. 홈페이지를 새로고침해 확인하세요.')};document.getElementById('reset').onclick=()=>{localStorage.removeItem('lightonSiteContent');location.reload()};document.getElementById('export').onclick=()=>{ids.forEach(id=>set(paths[id],document.getElementById(id).value));const blob=new Blob(['window.SITE_CONTENT = '+JSON.stringify(d,null,2)+';'],{type:'text/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='site-content.js';a.click();URL.revokeObjectURL(a.href)}
</script></body></html>
